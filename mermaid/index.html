## Prologue | Export Chat | 11 November 2026, 1:31 a.m.

At 1:31 in the morning on the eleventh of November, a young man typed a single letter into his phone and sent it to a girl who was no longer his.

@ Wednesday, 11 November 2026
> 01.31 | p
> 01.31 | pls
> 01.31 | answer
> 01.31 | if you're still awake

She was awake. She was almost always awake at that hour; so was he. If you had asked either of them what time of day they had fallen in love, they would not have been able to tell you, but if you had asked what time of day they had done most of their loving, the answer would have been easy. Somewhere between one and four in the morning. The hours when everyone else is asleep and two people can pretend the world has been built for them alone.

< 01.31 | what is it
> 01.32 | can i ask you a favour
< 01.32 | what
> 01.32 | go to my contact. tap the profile. scroll all the way down
> 01.32 | there's something that says export chat
> 01.32 | press the one with media. send it here
< 01.33 | why
> 01.33 | just send it without asking. please
> 01.34 | i'm doing something special right now

Eight minutes later, a file arrived. It was not large, as files go. A few hundred megabytes. Inside it were stickers that nobody would ever send again, voice notes that nobody would ever transcribe, and twenty-eight thousand lines of text. Twenty-eight thousand lines, two years, one boy, one girl, and a great many messages that simply said *this message was deleted* — little ghosts of things somebody had once wanted to say and then, at the last second, had been too proud or too frightened to keep.

People like to believe that love stories are made of grand moments. Rain at an airport. A confession on a rooftop. A ring in a glass of wine.

They are not. Not usually. Most love stories, if you could export them, would turn out to be made of very small things. Of *where are you*. Of *have you eaten*. Of *wake me up at nine*. Of a single letter, sent at one in the morning, that means nothing at all and everything at once.

This is the story of those twenty-eight thousand lines.

Not all of them. Only the ones that mattered — and a few that did not, because, as you will see, those mattered too.

## One | The Letter P | October – December 2024

There are people who begin conversations with *hello*, and people who begin them with *good evening, how are you, I hope I'm not disturbing you*, and then there was Saqil, who began almost everything with a single letter.

*p.*

It is not really a word. In the language they spoke it is something closer to a tap on the shoulder, the digital equivalent of knocking twice on a door you already know is unlocked. It means: *are you there?* It means: *I'm here.* It costs nothing to send, which is precisely why it can cost so much when nobody answers.

He sent it to her for the first time — the first time the phone remembered, at least — at fourteen minutes to one on the eighteenth of October, 2024. Twelve seconds later, she sent it back.

@ Friday, 18 October 2024
> 00.46 | p
< 00.46 | p

That was all. Two letters, twelve seconds apart. By then they already belonged to each other, though neither of them could have told you exactly when that had happened. Half an hour later he wished her goodnight, and the word he used for her was *syg* — short for *sayang*, darling — the way you shorten something you intend to say ten thousand more times.

Love, like the first message of a chat, is rarely recorded. We only ever save what comes after.

***

He was the kind of young man people describe with the word *confident* when they like him and *arrogant* when they don't. He drove at night with the windows down. He smoked more than he admitted to, and admitted to more than most people would. He believed, quite sincerely, that he could predict which way a stock would move, and later he would claim that the same talent applied to women — *Ines only*, he would add, as if that made it more modest. He had a habit of explaining a problem by starting from its very origin, the way some people explain a road by describing the mountain it was cut through. He knew this about himself. *Sorry if my words are complicated,* he once wrote to her, *but when I talk about something I have to know where it came from.*

She called him *abang*. It is what a girl in Jakarta calls an older boy — a brother, a protector, the one who is supposed to know the way — and when she said it to him it meant all of those things, and also something softer that had no translation. When she was being sweet she called him *seng*, which was *sayang* worn smooth from use. When she was angry she called him *bang*, short and sharp, like a door closing.

The name that appeared above her messages was *mermaid*.

She was sentimental, and knew it, and said so. She cried for a few days before her period every month, hard, the kind of crying that shakes the shoulders, and she would apologise for it afterwards as if it had been a crime. She had friends from kindergarten, from primary school, from middle school and high school, nearly all of them still living a few streets away, so that being her boyfriend meant being introduced, one by one, to an entire childhood. She sent stickers the way other people breathe.

Their first weeks are mostly silence in the archive — missed calls, a *woiii* sent into the void, a *hi, what are you doing* answered forty minutes later with *driving*. The real conversation had not started yet. It was waiting, the way rain waits behind a hot afternoon.

In December, it broke. One thousand eight hundred and sixty-seven messages in a single month.

***

On the fourth of December, at one in the morning, his phone was dying and hers was in another room. He had just got home. He told her to sleep. She refused. He asked if she was sleepy, then asked again in capital letters, and added a knife, because that is how affection looked between them — a little violent, a little ridiculous, entirely sincere.

@ Wednesday, 4 December 2024
> 01.25 | are you sleepy
> 01.25 | are you sleepy, DARLING
> 01.25 | 🔪
> 01.28 | come here, kiss first
< 01.28 | DARLING
< 01.28 | WAIT
< 01.28 | I'M IN THE BATHROOM
> 01.28 | so long

Then something happened that the archive does not explain. Perhaps the call dropped. Perhaps his battery finally gave up. Whatever it was, at a quarter to three she wrote:

< 02.46 | you just hung up and didn't even say love you back
< 02.46 | 😢😢💔💔💔
< 02.47 | are you annoyed with me?
>x 03.02 |
>x 03.02 |
>x 03.02 |
> 03.37 | no way
> 03.37 | i thought YOU were the one who ended it

Three deleted messages. We will never know what they said. Perhaps they were angry and he thought better of it. Perhaps they were tender and he was embarrassed. Perhaps they were simply typos. That is the cruelty and the mercy of a deleted message: it lets a person be braver in the first draft than in the final one.

An hour later, at 4:32 a.m., he sent the message that would become the most repeated sentence of their entire story.

> 04.32 | please wake me up at 8, 10:50 and 13:30 (if you're up)

Some people say *I love you* with flowers. Some say it with poems. Saqil said it with a list of times he wanted to be woken up. It is a strange kind of trust, to hand someone your mornings. To say: *the first voice I want to hear today is yours, and if I oversleep, it's your fault.*

She took the job. She would keep it, on and off, for two years — long after she had any obligation to.

***

There were other things in December. A night she discovered a secret about a friend only because he had told her to ask. A night he wrote her three long, solemn paragraphs about presidential politics, the kind of thing a student copies into an assignment at two in the morning. And a night — the first real crack — when he wrote something that would echo through the next seven months:

@ Monday, 9 December 2024
> 02.10 | if you're really that scared of your friends turning on you, then fine. your friends matter more than me

It was a small sentence. Most dangerous sentences are.

## Two | Three Bubbles | January 2025

The party was at a house that belonged to a friend named Salwa, and it was the kind of party Ines had never been to before — she would say so herself, later, a little defensively, as if confessing to a crime she had not enjoyed committing. *I didn't know what to wear,* she wrote. *My friends were all wearing things like that.*

He was there, or near enough to it. Something happened — the archive is vague, the way a phone always is about the things that happen in person. She did not introduce him to her friends. Or she introduced him badly. Or someone from her university looked at him the wrong way and he felt, for the length of a song, like a stranger at his own girlfriend's side.

By three in the morning he had decided that they were finished.

@ Sunday, 26 January 2025
< 02.54 | bang we are not breaking up
< 02.54 | and you can't just decide that on your own
< 02.55 | i'm sorry if you think i replied to you rudely
> 02.56 | don't say things just to calm me down
> 02.56 | you said you'd change my mind. but i don't trust you anymore
< 02.57 | how do i make you trust me again
< 02.57 | what do i have to do
> 02.57 | think about it yourself
> 02.57 | fyi this can only be done right now
> 02.58 | the longer you take, the more official our breakup gets

There is a particular kind of cruelty that only exists between people who love each other — the cruelty of a test. He did not want to break up. He wanted to be chosen, loudly, in front of everyone, and he did not know how to ask for that, so he set a timer instead.

> 03.01 | i'll give you a chance
> 03.01 | you have 3 bubbles left to text me
> 03.02 | if it's more than that and it's still bullshit, i'm blocking you. i'm not joking nes
> 03.02 | use those 3 bubbles well
> 03.03 | and now i'm going to sleep
> 03.04 | fine. i'll give you one extra. last chat. say whatever you want to say to me

He did not go to sleep. Of course he didn't. One minute later he was back, checking.

> 03.04 | wow are you seriously asleep
< 03.04 | no. i'm still thinking

And then she did the only thing she could think of. She left the party. She walked out into the dark at three in the morning to fetch her motorbike from Salwa's house, to come home, to fix it — whatever *it* was — in person.

It took him a full minute to understand what she was doing. When he did, the whole tone of the story changed in the space of a single breath.

< 03.06 | it's here, i'm going home
> 03.06 | going home and still breaking up then
> 03.06 | YOU'RE THE ONE WHO'S GOING TO GET MUGGED
< 03.07 | calm down i'm walking out
> 03.07 | WHEN YOU GO GET THE BIKE, IDIOT
> 03.07 | YES WE'RE NOT BREAKING UP
> 03.07 | NOW YOU'RE GOING HOME AND I'M EVEN MORE ANNOYED
> 03.07 | THAT'S NOT WHAT I MEANT
> 03.07 | THAT IS NOT WHAT I MEANT, ARE YOU CRAZY
> 03.08 | i'm the one who's worried sick, if that's how it is
> 03.08 | WHAT I MEANT WAS FOR YOU TO INTRODUCE ME TO YOUR FRIENDS

Read it again. Read it the way she must have read it, standing alone on a dark street with a phone in her hand. *YES WE'RE NOT BREAKING UP.* The breakup had lasted twelve minutes and had been ended not by an apology, not by a promise, but by the simple, terrible image of her in the dark, alone, on a road where things happen to girls at three in the morning.

That is the thing about anger. It is very loud, and very certain, right up until the moment it remembers what it is actually afraid of.

< 03.13 | i'm going back to salwa's
< 03.13 | i'm sorry i didn't introduce you
< 03.15 | when they come back i'll introduce you
< 03.15 | i'm sorry my brain didn't get there
< 03.15 | bang what should i do

*Bang, what should I do.* Not *you're overreacting*. Not *this is unfair*. Only that. She was nineteen or twenty and walking back through the dark to a party she hadn't wanted to go to, to introduce a boy to her friends because he had asked her to in the most backwards way a person can ask for anything.

He was not easy to love. But she was trying, and he could see it, and for one night, at least, that was enough.

## Three | Dairy Milk or SilverQueen | February 2025

On the fourth of February, a little after three in the morning, Saqil switched languages.

He did that sometimes, when the thing he needed to say was too big for the language he had grown up in. Indonesian was for jokes, for fights, for *where are you* and *have you eaten*. English — his English, uneven and hurried, misspelled in all the places where the feeling outran the fingers — was for the things he could not say with a straight face.

@ Tuesday, 4 February 2025
> 03.04 | don't be patient with me, cause i love you more than everything, more than you can imagine
> 03.06 | cause i don't care about your past, or the boys who came before me
> 03.09 | i can do anything to make you trust me more than i trust you
> 03.10 | sometimes, this time or next time, it will become the biggest problem, so we have to prepare from now
> 03.12 | you're my baby, so i can handle you into the future, for the best confident love, or like a love story or something like that

*A love story or something like that.* He did not know, then, that he was writing the first line of one. Nobody ever does.

***

Eight days later, they had the strangest and most honest conversation of their entire relationship.

It began, as their worst nights always began, with something small — a remark he had made about choosing her over his friends that she had heard as a complaint. *If you don't want a girlfriend who sulks,* she wrote, *then don't be so annoying as a man.* And then, at 1:49 a.m., something she had clearly been holding for a long time:

@ Wednesday, 12 February 2025
< 01.49 | bang you know i'm a really sentimental person, so please stop poking at things that make me overthink and get hurt
< 01.50 | i know you're joking. it's just that i can't, i don't get your kind of jokes

He told her that she was the only person he had ever told his problems to. That he hated spreading his troubles around. That his friends were always too kind to criticise him honestly, and that if she thought he was a narcissist — well. He admitted it. *I'm handsome, I'm cool, there's nobody like me,* he wrote, perfectly seriously, *but I'm not that arrogant with just anyone.*

And then, somewhere around half past two, the conversation turned into a list.

Neither of them proposed it. It simply happened, the way a fight turns into a confession when both people are too tired to keep pretending. One of them wrote *I don't like it when...* and the other answered with another, and for nearly an hour they took turns, back and forth, like two people emptying their pockets onto a table.

## Four | Sahur | March 2025

March was the month of the most messages. Seven thousand, one hundred and seventy of them — more than two hundred a day, more than one every seven minutes of every waking hour. It was also Ramadan, which meant that the nights, which had always belonged to them, now had a reason.

In the fasting month the whole city wakes before dawn to eat *sahur*, the last meal before the sun rises, and for a few weeks the hours they had always stolen were suddenly legitimate. He would pick her up on his motorbike. They would ride around in the blue dark with nowhere in particular to go, and on the way home they would stop and buy something to eat. She described it to someone once, and the message survives:

That is all. One sentence. But anyone who has ever been young in a city at four in the morning, holding on to somebody's waist on the back of a motorbike while the mosques begin to wake, will know exactly what it meant.

She told him things that month that girls only tell boys they are thinking of marrying. That she wanted, one day, to be the kind of wife who dropped the children off at school and then went to pilates, then to the spa, then to the salon. That if he wanted to bulk up, he should just eat a lot of rice and eat late at night. That a friend of hers was seven months pregnant and getting married in April, and here, look, this is what a religious marriage means and this is what a civil one means, and why it matters which one comes first. She was not asking him anything. She was only telling him. But some information is a question in disguise.

## Five | What Cannot Be Taken Back | April 2025

Not every chapter of a love story should be told in full. Some belong only to the two people who lived them, and the most a narrator can do is stand outside the door, at a respectful distance, and report what was said once they came back out.

So this chapter will be quiet.

On the seventh of April, at four minutes to midnight, she sent him an apology that is perhaps the most tender thing in the whole archive — not because of what it says but because of how much of it there is. *Sorry, darling, for repeating my mistake,* she wrote, *I only just got home now because I was waiting for Nadya to finish work, then I picked her up, then we went to meet Ajeng, then I drove her home first, her house is in Pondok Ranji, and the back road was closed so I had to go all the way round past the petrol station, and I stopped to buy ginger milk for my mum, that's why I'm so late.*

It is enough to say this: there had been a night in his car that lasted until morning, and there had been, later, an afternoon at his house. She had chosen it. She said so, again and again, more clearly than he did — that it had been her own decision, that nobody had forced her, that a girlfriend is still only a girlfriend and that it had been her job, not his, to protect herself. And she said, too, the thing that so many girls in her world are taught to fear: that one day a man might not want her because of it.

## Six | Weton | May – June 2025

There is an old Javanese way of counting days called *weton*. Each person is born on one of the seven days of the week and also on one of the five days of the old Javanese market cycle — *Legi, Pahing, Pon, Wage, Kliwon* — so that every birth falls on one of thirty-five possible combinations, each with its own meaning. For centuries, when two people wanted to marry, their families would take their wetons to an elder, who would add the numbers together and say whether the couple were suited, and on which day it would be safest to join them.

In May, Ines wrote an essay about it.

She sent it to him in pieces, the way students send assignments to the people they trust to read them — paragraph after paragraph of history and culture and Koentjaraningrat, the old Hindu-Buddhist kingdoms, the Islamic acculturation, a case study of wedding-day calculations in Yogyakarta. *Weton,* she had written, in her careful academic Indonesian, *is a way for people to build harmony.*

If there is irony in the universe — and anyone who has ever loved somebody will tell you there is — it was in that month. Because while she was writing about the ancient science of whether two people belong together, the two of them were quietly coming apart.

## Seven | The KTP | July – August 2025

The archive does not contain the breakup.

That is the first thing you must understand. Somewhere between the tenth of July, when she asked him what day he was going to campus, and the twenty-eighth, when she next wrote, two people who had sent each other seven thousand messages in a single month stopped being a couple — and not one word of it was typed. Perhaps it happened on the phone. Perhaps in person, in a parked car, with the engine running. Perhaps it did not happen at any single moment at all, but slowly, the way a song ends on the radio when you are not paying attention, so that you only notice the silence.

All we have is what came after. And what came after was an identity card.

A year and a half earlier, she had sent him an essay about the ancient Javanese art of deciding whether two people belong together. Now he was doing her homework at five in the afternoon, badly, with help he insisted did not count. There is a symmetry in it that only the archive can see. People do not stop caring about each other just because they have stopped calling it love. Sometimes they simply change the name of the thing they are doing.

That night, at 11:50, he wrote to her in the old way — in English, because it was too big for the other language:

> 23.50 | can you be my ears for a sec
> 23.50 | just finish your homework
> 23.50 | we can talk later

And at four in the morning, as if the last two years had been one long night that had never really ended:

@ Monday, 2 November 2026
> 04.56 | wake me up at 9 yaa
< 04.56 | i haven't even slept yet

It was the same request. The same hour. The same boy, the same girl, two Novembers after the first time he had handed her his mornings. Four days later he overslept, skipped work, and complained that she had failed in her one duty — waking him up. *The only duty is prayer,* she told him, primly. He told her she didn't pray either. She called him ugly. He asked what they were even talking about.

Nobody knew. That was the point. That was always the point.

***

And so we come back to where we began.

At 1:31 in the morning on the eleventh of November, he sent her a single letter. Then another. Then *please*. She answered *what is it*, and he asked her to do something strange — to open his contact, scroll to the very bottom, find the words *export chat*, and press the one *with media*.

@ Wednesday, 11 November 2026
< 01.33 | why though
< 01.33 | what's it for
> 01.33 | just do it nes
> 01.34 | i'm doing something special right now
< 01.36 | the very bottom, is that report?
> 01.37 | export
< 01.37 | ohh wait
> 01.38 | with media ok

At 1:39 the file arrived. At 1:41 he sent her back the little gift link she had given him at midnight on his birthday, eleven months earlier — the one she had stayed up for. And at 1:41 and fifty-six seconds she sent him a voice note.

The archive does not say what was in it. Voice notes do not export as words. They export only as a filename, a length, a little grey file that you have to press to hear — and this story, the one you are holding, was written by somebody who could not press it.

So we will leave it there. Unplayed.

***

There is a thing that happens at the end of most novels, where the author tells you what became of everyone. Whether they married. Whether they moved away. Whether, in the last chapter, standing in the rain, one of them finally said the thing.

This story cannot do that, because this story is not over. It was exported in the middle. It stops not at an ending but at a voice note, and a boy at his desk at two in the morning, and a girl somewhere across the city who had just sent him the whole of their history because he asked her to, without — in the end — needing to know why.

Perhaps that is enough. Perhaps, of all the things one person can give another, that is one of the rarest: not a promise about the future, but a perfect copy of the past. *Here. All of it. Every sticker, every fight, every deleted message, every time I said I hated you and every time I said I didn't. Do with it what you like.*

What he did with it, reader, is this.

~ p.

## Epilogue | A Note on the Archive |

Twenty-eight thousand and ten lines.

Two years and twenty-four days, from the eighteenth of October, 2024, to the eleventh of November, 2026.

Seven thousand, one hundred and seventy messages in the month of March 2025 alone, when they rode through the blue dark before sahur and bought food on the way home.

Two messages in November 2025, when one of them had stopped answering.

One identity card, eventually returned.

One hoodie, one shirt, one zip jacket, never returned at all.

Two bouquets on a birthday. One of them red. One of them kept.

Countless messages that read, simply, *this message was deleted* — each one a small, invisible kindness or cowardice, each one a sentence someone was brave enough to write and not quite brave enough to send. If you could read them all, you would probably learn nothing new. They were almost certainly the same things everybody else says, in the end. *I miss you. I'm sorry. Come back. Don't.*

And one letter, sent more times than anyone could count, which in the language they spoke means nothing at all, and which in theirs meant: *Are you there? I'm here.*

~ For Ines — who answered, more often than not.

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
"use strict";
const BOOK_TITLE = "Last Seen at 1 A.M.";
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>");
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ---------- parse manuscript ---------- */
function parse(){
  const raw = $("#manuscript").textContent.replace(/\r/g,"");
  const chapters = [];
  let ch = null, para = [];
  const flush = () => { if(para.length && ch){ ch.blocks.push({t:"p", text:para.join(" ")}); } para = []; };
  for(const lineRaw of raw.split("\n")){
    const line = lineRaw.trim();
    if(line.startsWith("## ")){
      flush();
      const [num,title,when] = line.slice(3).split("|").map(x=>x.trim());
      ch = {num,title,when:when||"",blocks:[]}; chapters.push(ch); continue;
    }
    if(!ch) continue;
    if(line===""){ flush(); continue; }
    let m;
    if(line==="***"){ flush(); ch.blocks.push({t:"brk"}); continue; }
    if(line.startsWith("@ ")){ flush(); ch.blocks.push({t:"day", text:line.slice(2)}); continue; }
    if(line.startsWith("~ ")){ flush(); ch.blocks.push({t:"c", text:line.slice(2)}); continue; }
    if((m = line.match(/^([<>])(x?)\s*([\d.]+)\s*\|\s*(.*)$/))){
      flush(); ch.blocks.push({t:"msg", who:m[1]==="<"?"i":"s", del:!!m[2], time:m[3], text:m[4]}); continue;
    }
    para.push(line);
  }
  flush();
  // mark first paragraph in each chapter + after breaks; mark message runs
  for(const c of chapters){
    let needFirst = true;
    c.blocks.forEach((b,i)=>{
      if(b.t==="p"){ b.first = needFirst && i===0 ? true : false; b.noind = needFirst && !b.first; needFirst=false; }
      else if(b.t==="brk"){ needFirst = true; }
      else if(b.t==="msg" || b.t==="day"){ needFirst = true; }
      if(b.t==="msg"){
        const prev = c.blocks[i-1], next = c.blocks[i+1];
        b.showWho = !(prev && prev.t==="msg" && prev.who===b.who);
        b.lastOfRun = !(next && next.t==="msg");
      }
    });
  }
  return chapters;
}

function blockHTML(b, words){
  switch(b.t){
    case "p": {
      const txt = words ? words : b.text;
      const cls = b._cont ? "cont" : (b.first ? "first" : (b.noind ? "noind" : ""));
      return `<p class="${cls}">${inline(txt)}</p>`;
    }
    case "brk": return `<div class="brk">✦ ✦ ✦</div>`;
    case "c": return `<p class="c">${inline(b.text)}</p>`;
    case "day": return `<div class="day">${esc(b.text)}</div>`;
    case "msg": {
      const who = b.showWho ? `<span class="who">${b.who==="i"?"mermaid":"saqil"}</span>` : "";
      const body = b.del ? `<span class="b del">this message was deleted<span class="t">${esc(b.time)}</span></span>`
        : `<span class="b">${who}${inline(b.text)}<span class="t">${esc(b.time)}</span></span>`;
      return `<div class="msg ${b.who}">${body}</div>${b.lastOfRun?'<div class="msgend"></div>':''}`;
    }
  }
  return "";
}

/* ---------- geometry ---------- */
function geometry(){
  const vw = window.innerWidth, vh = window.innerHeight - 56 - 24;
  const spread = vw >= 900 && vw/vh > 1.05;
  let pw, ph;
  if(spread){
    ph = Math.min(vh - 20, 860);
    pw = Math.round(ph / 1.42);
    if(pw*2 > vw - 60){ pw = Math.floor((vw-60)/2); ph = Math.round(pw*1.42); }
  } else {
    pw = Math.min(vw - 32, 560);
    ph = Math.min(vh - 10, Math.round(pw*1.75));
    if(ph < pw*1.25) { ph = Math.round(pw*1.25); }
  }
  ph = Math.max(ph, 360);
  const fs = Math.max(14, Math.min(19.5, pw*0.0335));
  const px = Math.round(pw*0.105), pt = Math.round(ph*0.085), pb = Math.round(ph*0.085);
  return {spread, pw, ph, fs, px, pt, pb};
}

function shell(g, cls, running, folio, inner){
  // StPageFlip rewrites the .page element's inline style, so sizing + vars live on an inner wrapper
  return `<div class="page ${cls}" style="width:${g.pw}px;height:${g.ph}px"><div class="pbox" style="position:relative;width:${g.pw}px;height:${g.ph}px;--fs:${g.fs}px;--px:${g.px}px;--pt:${g.pt}px;--pb:${g.pb}px;font-size:${g.fs}px">
    <div class="pinner">${running!=null?`<div class="running">${esc(running)}</div>`:""}${inner}</div>
    ${folio!=null?`<div class="folio">${folio}</div>`:""}
  </div></div>`;
}

/* ---------- pagination ---------- */
function paginate(chapters, g){
  const meas = $("#measure");
  meas.innerHTML = shell(g,"paper","x","1",`<div class="content"></div>`);
  const box = meas.querySelector(".content");
  const fits = () => box.scrollHeight <= box.clientHeight + 1;
  const pages = [];   // {html, chapter}
  const chapStart = [];

  chapters.forEach((c, ci)=>{
    const head = `<div class="chap-head"><div class="num">${c.num==="Prologue"||c.num==="Epilogue"?esc(c.num):"Chapter "+esc(c.num)}</div><div class="ttl">${esc(c.title)}</div>${c.when?`<div class="when">${esc(c.when)}</div>`:""}<span class="orn"></span></div>`;
    let cur = head, isFirstPage = true;
    chapStart.push(pages.length);
    const commit = () => { pages.push({html:cur, ch:c, first:isFirstPage}); cur=""; isFirstPage=false; };
    const queue = c.blocks.map(b=>Object.assign({},b));
    while(queue.length){
      const b = queue.shift();
      const h = blockHTML(b);
      box.innerHTML = cur + h;
      if(fits()){ cur += h; continue; }
      if(b.t==="p"){
        const words = b.text.split(" ");
        let lo=0, hi=words.length;
        while(lo<hi){ const mid=Math.ceil((lo+hi)/2); box.innerHTML = cur + blockHTML(b, words.slice(0,mid).join(" ")); if(fits()) lo=mid; else hi=mid-1; }
        if(lo >= 4 || (lo>0 && cur==="")){
          // avoid leaving a single line widow at the bottom: require at least ~4 words
          cur += blockHTML(b, words.slice(0,lo).join(" "));
          commit();
          queue.unshift(Object.assign({}, b, {text:words.slice(lo).join(" "), _cont:true, first:false}));
        } else {
          if(cur==="" ){ cur += h; commit(); } // pathological: force
          else { commit(); queue.unshift(b); }
        }
      } else {
        // keep a date chip with the message that follows it
        if(cur===""){ cur += h; commit(); continue; }
        if(b.t!=="day"){
          const prevDay = cur.lastIndexOf('<div class="day">');
          if(prevDay>=0 && cur.slice(prevDay).indexOf('<div class="msg')===-1){
            const dayHtml = cur.slice(prevDay); cur = cur.slice(0,prevDay); commit(); cur = dayHtml; queue.unshift(b); continue;
          }
        }
        commit(); queue.unshift(b);
      }
    }
    if(cur.trim()!=="") commit();
  });
  meas.innerHTML = "";
  return {pages, chapStart};
}

/* ---------- build book ---------- */
let pf = null, total = 0, tocTargets = [], frontCount = 0, built = null;

function build(){
  const g = geometry();
  const chapters = window.__chapters || (window.__chapters = parse());
  const {pages, chapStart} = paginate(chapters, g);

  const out = [];
  // cover
  out.push(shell(g,"cover",null,null,`<div class="frame"></div><div class="moon"></div><div class="kicker">A Novel</div><h1>Last Seen<em>AT 1 A.M.</em></h1><div class="sub">twenty-eight thousand messages, two years, and a single letter</div><div class="auth">Saqil &amp; Ines</div>`));
  // inside cover
  out.push(shell(g,"paper blankpage center-page",null,null,`<div style="letter-spacing:.6em">✦</div>`));
  // title page
  out.push(shell(g,"paper center-page titlepage",null,null,`<div><h2>Last Seen<br>at 1 A.M.</h2><div class="by">a novel, told from a WhatsApp archive</div></div><div class="pub">October 2024 — November 2026</div>`));
  // epigraph
  out.push(shell(g,"paper center-page",null,null,`<div class="epi">“Some people say <em>I love you</em> with flowers.<br>Some say it with poems.<br>He said it with a list of times<br>he wanted to be woken up.”<span class="src">— Chapter One</span></div>`));
  // contents (filled after we know numbers)
  const tocIndex = out.length;
  out.push("");
  out.push(shell(g,"paper blankpage center-page",null,null,`<div style="font-family:var(--display);font-style:italic;color:var(--ink-soft)">for the hours between one and four</div>`));
  frontCount = out.length;

  pages.forEach((p, i)=>{
    const n = i+1;
    const run = p.first ? null : ((frontCount + i) % 2 === 1 ? BOOK_TITLE : p.ch.title);
    out.push(shell(g,"paper",run,p.first?null:String(n),`<div class="content">${p.html}</div>`));
  });

  tocTargets = chapStart.map(s => frontCount + s);
  const tocHTML = `<div class="toc"><h3>Contents</h3>${chapters.map((c,i)=>`<a data-go="${tocTargets[i]}"><span class="nn">${/^\d|^[A-Z][a-z]+$/.test(c.num)&&c.num!=="Prologue"&&c.num!=="Epilogue"?romanize(i):""}</span><span class="tt">${esc(c.title)}</span><span class="dots"></span><span class="pg">${chapStart[i]+1}</span></a>`).join("")}</div>`;
  out[tocIndex] = shell(g,"paper",null,null,tocHTML);
  $("#tocbox").innerHTML = tocHTML.replace("<h3>Contents</h3>","<h3 style='margin-top:0'>Contents</h3>");

  // back matter: ensure even count so back cover lands right
  if((out.length+1) % 2 === 1) out.push(shell(g,"paper blankpage center-page",null,null,`<div style="letter-spacing:.6em">✦</div>`));
  out.push(shell(g,"cover back",null,null,`<div class="frame"></div><div><p>“It is possible to be someone's entire screen and still not be in the room with them.”</p><div class="orn2">✦</div><p style="font-size:.85em">A story reconstructed from 28,010 lines of a WhatsApp chat — every message translated, every silence kept.</p></div>`));

  total = out.length;
  return {g, out};
}

function romanize(i){ return ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII"][i]||""; }

let fallbackIdx = 0;
function mount(startFrac){
  const {g, out} = build();
  const wrap = $("#bookwrap");
  if(pf){ try{ pf.destroy(); }catch(e){} pf = null; }
  wrap.innerHTML = "";
  const host = document.createElement("div");
  wrap.appendChild(host);
  host.innerHTML = out.join("");
  const startPage = Math.max(0, Math.min(total-1, Math.round((startFrac||0)*(total-1))));

  if(window.St && St.PageFlip){
    host.querySelectorAll(".page").forEach((p,i)=>{ if(i===0||i===total-1) p.setAttribute("data-density","hard"); });
    pf = new St.PageFlip(host, {
      width:g.pw, height:g.ph, size:"fixed", showCover:true, usePortrait:!g.spread,
      maxShadowOpacity:.45, flippingTime:850, mobileScrollSupport:false, drawShadow:true, startPage
    });
    pf.loadFromHTML(host.querySelectorAll(".page"));
    pf.on("flip", e => onPage(e.data));
    onPage(pf.getCurrentPageIndex());
  } else {
    // simple fallback viewer
    host.id = "fallback";
    const pages = [...host.querySelectorAll(".page")];
    fallbackIdx = startPage;
    const step = g.spread ? 2 : 1;
    const show = () => {
      pages.forEach((p,i)=>{
        let vis;
        if(!g.spread) vis = i===fallbackIdx;
        else if(fallbackIdx===0) vis = i===0;
        else { const left = fallbackIdx % 2 === 1 ? fallbackIdx : fallbackIdx-1; vis = i===left || i===left+1; }
        p.style.display = vis ? "" : "none";
      });
      onPage(fallbackIdx);
    };
    window.__fb = { next(){ fallbackIdx = Math.min(total-1, fallbackIdx===0?1:fallbackIdx+step); show(); }, prev(){ fallbackIdx = Math.max(0, fallbackIdx-step); show(); }, go(n){ fallbackIdx=n; show(); } };
    host.addEventListener("click", e => { const r = host.getBoundingClientRect(); (e.clientX - r.left) > r.width/2 ? window.__fb.next() : window.__fb.prev(); });
    show();
  }
}

function onPage(i){
  const label = i < frontCount ? (i===0 ? "Cover" : "—") : (i>=total-1 ? "The End" : `${i-frontCount+1}`);
  $("#pinfo").textContent = label === "—" ? "Front matter" : (label==="Cover"||label==="The End" ? label : `Page ${label} of ${total-frontCount-1}`);
  $("#prog").style.width = (100 * i/(total-1)) + "%";
  store.set("lastseen-page-frac", String(i/(total-1)));
}

const next = () => pf ? pf.flipNext() : window.__fb && window.__fb.next();
const prev = () => pf ? pf.flipPrev() : window.__fb && window.__fb.prev();
const go = n => { if(pf){ pf.turnToPage(n); onPage(n); } else if(window.__fb){ window.__fb.go(n); } };

$("#bNext").onclick = next; $("#bPrev").onclick = prev;
$("#bToc").onclick = () => $("#tocpanel").classList.add("on");
$("#tocpanel").addEventListener("click", e => {
  const a = e.target.closest("a[data-go]");
  if(a){ go(+a.dataset.go); }
  $("#tocpanel").classList.remove("on");
});
document.addEventListener("click", e => { const a = e.target.closest(".page a[data-go]"); if(a){ e.stopPropagation(); go(+a.dataset.go); } }, true);
document.addEventListener("keydown", e => {
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if(e.key==="Escape"){ $("#tocpanel").classList.remove("on"); }
});

let lastG = null, rT = null;
window.addEventListener("resize", () => {
  clearTimeout(rT);
  rT = setTimeout(() => {
    const g = geometry();
    if(lastG && Math.abs(g.pw-lastG.pw) < 8 && Math.abs(g.ph-lastG.ph) < 8 && g.spread===lastG.spread) return;
    const cur = pf ? pf.getCurrentPageIndex() : fallbackIdx;
    mount(cur/(total-1)); lastG = g;
  }, 250);
});

const start = () => {
  const saved = parseFloat(store.get("lastseen-page-frac") || "0") || 0;
  mount(saved); lastG = geometry();
  const L = $("#loading"); L.style.opacity = 0; setTimeout(()=>L.remove(), 650);
  setTimeout(()=>{ const h=$("#hint"); if(h) h.style.opacity=0; }, 4500);
};
// fonts are only fetched when used, so request every face explicitly before measuring pages
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
  '400 16px "EB Garamond"','italic 400 16px "EB Garamond"','500 16px "EB Garamond"',
  '400 16px "Cormorant Garamond"','500 16px "Cormorant Garamond"','italic 400 16px "Cormorant Garamond"'
].map(f=>document.fonts.load(f).catch(()=>null))).then(()=>document.fonts.ready) : Promise.resolve();
Promise.race([fontsReady, new Promise(r=>setTimeout(r,2500))]).then(start);
})();
</script>
